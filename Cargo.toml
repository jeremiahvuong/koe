[package]
name = "koe"
version = "0.3.0"
edition = "2024"
authors = ["Jeremiah Vuong <vuong@berkeley.edu>"]
readme = "README.md"
repository = "https://github.com/jeremiahvuong/koe"
description = "Natural language to shell commands"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5.40", features = ["derive"] }
dirs = "6.0"
gemini-rust = "0.4.2"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.8"
